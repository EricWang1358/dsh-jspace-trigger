name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # This repository is runtime-dependency-free: no lockfile exists and
      # `npm ci` is intentionally skipped to prove the suite runs on Node
      # built-ins alone.
      - name: Validate package entry & manifest
        run: node scripts/check.mjs

      - name: Run test suite
        run: node --test "tests/*.test.mjs"

  security:
    name: supply-chain scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `--omit=dev` + `--audit-level=high` fails the build on high/critical
      # advisories. With no runtime deps this is a fast no-network-download gate.
      - name: npm audit (high+) on runtime tree
        run: npm install --package-lock-only --ignore-scripts && npm audit --omit=dev --audit-level=high
